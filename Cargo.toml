[package]
name = "sse-space-syntax"
version = "1.1.0"
edition = "2021"
authors = ["Napat (Tan) Phasundhiae <tanfasantia@gmail.com>"]
description = "SSE — Space Syntax Engine: High-Performance Native Rust Standalone Workstation (depthmapX replacement) & CLI"
license = "MIT"
repository = "https://github.com/napattan/sse-space-syntax"
default-run = "sse-desktop"

[lib]
name = "sse_core"
path = "src/lib.rs"

[[bin]]
name = "sse-desktop"
path = "src/bin/sse_desktop.rs"

[[bin]]
name = "sse-cli"
path = "src/bin/sse_cli.rs"

[[bin]]
name = "sse-mcp"
path = "src/bin/sse_mcp.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.29"
rfd = "0.15"
ureq = { version = "2.10", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
